

# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Publish on NPM

on:
  workflow_dispatch:
      inputs:
        version-increment:
          type: choice
          description: 'Version Increment'
          required: true
          options:
            - 'patch'
            - 'minor'
            - 'major'
          default: 'patch'
permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish-on-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Versionate
        id: versionate
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          NEW_VERSION=$(npm version ${{ github.event.inputs.version-increment }})
          echo "version=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm ci
        
      - name: Publish to NPM
        # This command uses the GitHub OIDC token automatically
        run: npm publish

      - name: Create PR
        uses: peter-evans/create-pull-request@v4.2.3
        with:
          commit-message: Updated repository to ${{ steps.versionate.outputs.version }}
          title: Bump version to ${{ steps.versionate.outputs.version }}
          body: New release build
          branch: release/${{ steps.versionate.outputs.version }}
          base: master
